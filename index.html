<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holy Computer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fff;
            color: #000;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 20px auto;
        }

        .verse {
            color: #000;
            font-size: 14px;
            margin: 20px 0;
            padding: 10px;
            text-align: center;
            max-width: 600px;
        }

        .verse span {
            color: #666;
        }
    </style>
</head>
<body>
    <img src="jesus.jpg" alt="Holy Jesus">
    
    <div class="verse">
        "For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life."<br>
        <span>- John 3:16</span>
    </div>
</body>
</html>
